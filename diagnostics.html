<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=2426"><link rel="stylesheet" href="iron-web-polish.css?v=2426"><title>IRON · Diagnose</title></head><body><main class="pc-panel"><h1>Verbindung prüfen</h1><p>Diese Prüfung sendet keine SMS und führt keine PC-Befehle aus.</p><button id="test">PC PRÜFEN</button><pre id="result"></pre><a href="datenverbindung.html">Datenverbindung einrichten</a></main><script src="iron-local-data.js?v=2426"></script><script src="iron-menu.js?v=2426"></script><script>document.getElementById('test').onclick=async()=>{const out=document.getElementById('result');out.textContent='Prüfung läuft …';try{const health=await IRONLocalData.test();const state=await IRONLocalData.state();out.textContent='PC erreichbar · Schnittstelle '+health.version+' · IRON '+state.version+'\nAufgaben: '+state.tasks.length+' · Pläne: '+state.plans.length+' · Ideen: '+state.ideas.length;}catch(e){out.textContent=e.message;}};</script></body></html>
